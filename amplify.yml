version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline || npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: car_insurance_inspector/frontend
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
